[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "han-codebook-agent"
version = "0.3.0"
description = "Evidence-based offline-first historical Chinese phrase codebook research prototype"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0,<7", "python-docx>=1.1,<2"]

[project.scripts]
han-codebook = "han_codebook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
han_codebook = ["static/*.html"]
